<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SÜLEYMANİYE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a14;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    /* Animated background blobs */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .blob1 { width: 500px; height: 500px; background: #6c47ff; top: -10%; left: -10%; animation-delay: 0s; }
    .blob2 { width: 400px; height: 400px; background: #ff47a3; bottom: -10%; right: -10%; animation-delay: -4s; }
    .blob3 { width: 300px; height: 300px; background: #47c8ff; top: 40%; left: 60%; animation-delay: -8s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 40px) scale(1.1); }
    }

    /* Card */
    .card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 32px;
      padding: 56px 64px 48px;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
      max-width: 900px;
      width: 98vw;
    }

    .event-label {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 10px;
    }

    .title {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 48px;
      line-height: 1.2;
    }

    /* Countdown boxes */
    .boxes {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: nowrap;
      margin-bottom: 40px;
      align-items: center;
    }

    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 20px 16px 14px;
      width: clamp(80px, 13vw, 130px);
      position: relative;
      transition: transform 0.2s;
    }
    .box:hover { transform: translateY(-4px); }

    /* Flip number */
    .number-wrap {
      position: relative;
      height: 72px;
      overflow: hidden;
    }

    .number {
      font-size: clamp(2.8rem, 6vw, 4.2rem);
      font-weight: 800;
      line-height: 1;
      display: block;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
    }
    .number.flip-out {
      transform: translateY(-100%);
      opacity: 0;
    }
    .number.flip-in {
      transform: translateY(100%);
      opacity: 0;
    }
    .number.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .unit {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-top: 10px;
    }

    /* Separator dots */
    .sep {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding-bottom: 28px;
      flex-shrink: 0;
    }
    .sep span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      animation: blink 1s ease-in-out infinite;
    }
    .sep span:last-child { animation-delay: 0.5s; }

    @keyframes blink {
      0%,100% { opacity: 1; } 50% { opacity: 0.2; }
    }

    /* Date picker */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .controls label {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .controls input[type="datetime-local"] {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .controls input[type="datetime-local"]:hover,
    .controls input[type="datetime-local"]:focus {
      border-color: #a78bfa;
      background: rgba(167,139,250,0.12);
    }
    .controls input::-webkit-calendar-picker-indicator {
      filter: invert(1) opacity(0.5);
      cursor: pointer;
    }

    /* Finished message */
    .finished {
      display: none;
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #ff47a3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.6; }
    }

    /* Progress ring */
    .ring-wrap {
      position: absolute;
      top: -3px; left: -3px; right: -3px; bottom: -3px;
      border-radius: 22px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="bg">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
  </div>

  <div class="card">
    <p class="event-label">Geri Sayım</p>
    <h1 class="title" id="eventTitle">Tekamüle Geçiş İmtihani 🎉</h1>

    <div class="boxes" id="boxes">
      <div class="box" id="box-d">
        <div class="number-wrap"><span class="number visible" id="days">00</span></div>
        <span class="unit">Gün</span>
      </div>
      <div class="sep"><span></span><span></span></div>
      <div class="box" id="box-h">
        <div class="number-wrap"><span class="number visible" id="hours">00</span></div>
        <span class="unit">Saat</span>
      </div>
      <div class="sep"><span></span><span></span></div>
      <div class="box" id="box-m">
        <div class="number-wrap"><span class="number visible" id="minutes">00</span></div>
        <span class="unit">Dakika</span>
      </div>
      <div class="sep"><span></span><span></span></div>
      <div class="box" id="box-s">
        <div class="number-wrap"><span class="number visible" id="seconds">00</span></div>
        <span class="unit">Saniye</span>
      </div>
    </div>

    <div class="finished" id="finished">🎊 Tekamül İmtihani Bugün! 🎊</div>

    <div class="controls">
      <label for="datePicker">Tekamül İmtihanı:</label>
      <input type="datetime-local" id="datePicker" />
    </div>
  </div>

  <script>
    // Default: New Year 2026
    const defaultTarget = new Date('2026-07-23T00:00:00');

    const picker = document.getElementById('datePicker');
    // format for input
    const pad2 = n => String(n).padStart(2,'0');
    function toInputVal(d) {
      return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }
    picker.value = toInputVal(defaultTarget);

    let target = defaultTarget;

    picker.addEventListener('change', () => {
      const v = picker.value;
      if (v) {
        target = new Date(v);
        // Update title
        document.getElementById('eventTitle').textContent =
          target.toLocaleDateString('de-DE', { day:'numeric', month:'long', year:'numeric' }) + ' 🎯';
      }
    });

    // Animated flip
    function animateFlip(el, newVal) {
      const cur = el.textContent;
      if (cur === newVal) return;
      el.classList.remove('visible');
      el.classList.add('flip-out');
      setTimeout(() => {
        el.textContent = newVal;
        el.classList.remove('flip-out');
        el.classList.add('flip-in');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            el.classList.remove('flip-in');
            el.classList.add('visible');
          });
        });
      }, 200);
    }

    const dEl = document.getElementById('days');
    const hEl = document.getElementById('hours');
    const mEl = document.getElementById('minutes');
    const sEl = document.getElementById('seconds');
    const finished = document.getElementById('finished');
    const boxes = document.getElementById('boxes');

    function tick() {
      const now = new Date();
      const diff = target - now;

      if (diff <= 0) {
        boxes.style.display = 'none';
        finished.style.display = 'block';
        return;
      }

      boxes.style.display = 'flex';
      finished.style.display = 'none';

      const totalSecs = Math.floor(diff / 1000);
      const s = totalSecs % 60;
      const totalMins = Math.floor(totalSecs / 60);
      const m = totalMins % 60;
      const totalHours = Math.floor(totalMins / 60);
      const h = totalHours % 24;
      const d = Math.floor(totalHours / 24);

      animateFlip(dEl, String(d).padStart(2,'0'));
      animateFlip(hEl, String(h).padStart(2,'0'));
      animateFlip(mEl, String(m).padStart(2,'0'));
      animateFlip(sEl, String(s).padStart(2,'0'));
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
